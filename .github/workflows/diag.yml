name: diag2
on:
  workflow_dispatch:
    inputs:
      gib:
        description: 'GiB to grow'
        default: '8'
jobs:
  probe:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: u
          submodules: false
      - name: growtest
        run: |
          cd u
          git submodule update --init --depth 1 drivers/DarwinBoot 2>/dev/null || true
          ls drivers/DarwinBoot/Test/packed_ramdisk.py
          mkdir -p /tmp/w && cd /tmp/w
          echo "=== 造 32m APFS seed 并 pack ==="
          hdiutil create -size 32m -layout NONE -fs APFS -volname Data -type UDTO seed.cdr
          python3 - <<'PY'
import sys, pathlib
sys.path.insert(0, '/Users/runner/work/UniXNU-sheng/UniXNU-sheng/u/drivers/DarwinBoot/Test')
import packed_ramdisk
raw = pathlib.Path('/tmp/w/seed.cdr')
raw2 = pathlib.Path('/tmp/w/seed.img')
raw2.write_bytes(raw.read_bytes())
meta = packed_ramdisk.pack(raw2, pathlib.Path('/tmp/w/base.dbr'))
print('PACK:', meta)
PY
          ls -l /tmp/w/base.dbr
          echo "=== 检查 base.dbr 头部 ==="
          head -c 32 base.dbr | xxd
          echo "=== grow 到 ${{ inputs.gib }} GiB ==="
          python3 scripts/seed-data-grow.py --gib ${{ inputs.gib }} /tmp/w/base.dbr /tmp/w/out.dbr; echo "GROW_RC=$?"
          ls -l /tmp/w/out.dbr 2>/dev/null || echo NOOUT
