name: diag2
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-26
    steps:
      - name: grow
        run: |
          set -x
          cd /tmp && rm -rf gt && mkdir gt && cd gt
          # 复现 make-data-seed.py 的 32m APFS 卷
          hdiutil create -size 32m -layout NONE -fs APFS -volname Data -type UDTO seed.cdr
          MOUNT=/tmp/gt/mount && mkdir -p $MOUNT
          hdiutil attach -nobrowse -owners off -mountpoint $MOUNT -plist seed.cdr > att.plist
          DEV=$(plutil -extract system-entities.0.dev-entry raw att.plist)
          echo "DEV=$DEV"
          hdiutil detach "$DEV"
          # 打包成 raw 再扩 (模拟 packed_ramdisk)
          truncate -s 215g big.raw
          OUT=$(hdiutil attach -imagekey diskimage-class=CRawDiskImage -nomount -nobrowse big.raw)
          echo "OUT=$OUT"
          STORE=$(echo "$OUT" | grep -oE "/dev/disk[0-9]+" | head -1)
          echo "STORE=$STORE"
          echo "=== apfs list 全文 ==="
          diskutil apfs list -plist > apfs.plist; echo "rc=$?"
          plutil -p apfs.plist | head -40
          echo "=== 找 container ==="
          CONT=$(plutil -extract Containers.0.ContainerReference raw apfs.plist 2>&1)
          echo "CONT=$CONT"
          echo "=== resizeContainer 0 ==="
          diskutil apfs resizeContainer "$CONT" 0; echo "resize_rc=$?"
          hdiutil detach "$STORE" -force || true
