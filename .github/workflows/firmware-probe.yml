name: firmware-probe
on:
  workflow_dispatch:
    inputs:
      os:
        description: OS profile (only its output directory is used)
        type: choice
        options:
        - '27'
        - '26'
        - '17'
        default: '27'
permissions:
  contents: read
jobs:
  probe:
    name: firmware-only
    runs-on: macos-26
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
      with:
        repository: UniXNU/UniXNU-sheng
        path: device
        submodules: recursive
    - uses: actions/checkout@v4
      with:
        repository: UniXNU/UniXNU
        ref: 82b847c4ac3f68a57024b3082ffa3a03442defd9
        path: UniXNU
        submodules: recursive
    - uses: actions/checkout@v4
      with:
        repository: UniXNU/uefi-sheng
        path: uefi-sheng
        submodules: recursive
    - name: target this unit's partition layout
      # Upstream board.toml carries the 256G-class SKU LBA range (3094592..64007162).
      # This unit is the 1 TB SKU: the dual-system split created unixnu at
      # 184345344..257745663 (280 GiB), which UniXNU owns, and moved userdata to
      # 3094784..184345343. The build refuses a layout that does not match the
      # GPT, so those two numbers are rewritten here rather than shipping a
      # forked board.toml.
      working-directory: device
      run: |
        python3 - <<'PY'
        import pathlib, re
        first, last = 184345344, 257745663
        path = pathlib.Path('board.toml')
        text = path.read_text(encoding='utf-8')
        if not re.search(r'^"first_lba" = %d$' % first, text, re.M):
            text, n1 = re.subn(r'^"first_lba" = \d+$', '"first_lba" = %d' % first, text, count=1, flags=re.M)
            text, n2 = re.subn(r'^"last_lba" = \d+$', '"last_lba" = %d' % last, text, count=1, flags=re.M)
            if n1 != 1 or n2 != 1:
                raise SystemExit('could not rewrite the userdata LBAs')
            path.write_text(text, encoding='utf-8')
        print('userdata %d..%d (1 TB SKU, unixnu 280 GiB)' % (first, last))
        PY
    - name: tools
      run: "brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools\
        \ bison pkgconf rustup blacktop/tap/ipsw\n{\n  echo \"$HOME/.cargo/bin\"\n\
        \  echo \"/opt/homebrew/opt/llvm/bin\"\n  echo \"/opt/homebrew/opt/lld/bin\"\
        \n  echo \"/opt/homebrew/opt/bison/bin\"\n} >> \"$GITHUB_PATH\"\nrustup toolchain\
        \ install 1.98.0 --profile minimal --component rust-src\n"
    - name: repair the pinned Mesa series
      working-directory: device
      run: python3 scripts/repair-mesa-series.py ../UniXNU
    - name: fetch the Wi-Fi supplicant sources
      working-directory: device/drivers/Ath12kWifi
      timeout-minutes: 45
      run: 'python3 ../../scripts/fix-ath12k-sparse-paths.py .

        python3 ../../scripts/patch-fetch-sources.py .

        python3 tools/fetch-sources.py

        python3 tools/fetch-sources.py --check

        '
    - name: advance the sm8550 kit pin
      working-directory: device
      run: python3 scripts/advance-sm8550-kit.py ../UniXNU .
    - name: stage the proprietary firmware blobs
      working-directory: device
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: 'python3 scripts/stage-proprietary.py .

        python3 scripts/stage-proprietary.py . --check

        '
    - name: patch the fileset reference build
      working-directory: device
      run: python3 scripts/patch-fileset-reference.py ../UniXNU
    - name: advance the XnuPrelink submodule
      run: 'cd UniXNU/kits/XnuPrelink

        git fetch --depth 1 origin 440589b0c31625f17edf363e24b3c82c51c70bb9

        git checkout --detach FETCH_HEAD

        '
    - name: raise the metal bridge cargo timeout
      working-directory: device
      run: python3 scripts/patch-metal-bridge-timeout.py ../UniXNU
    - name: patch the prelink layout
      working-directory: device
      run: python3 scripts/patch-prelink-layout.py ../UniXNU
    - name: patch the prelink dependency closure
      working-directory: device
      run: python3 scripts/patch-prelink-closure.py ../UniXNU
    - name: patch the weak defaults
      working-directory: device
      run: python3 scripts/patch-weak-defaults.py ../UniXNU
    - name: build cache identity
      id: build-cache
      working-directory: device
      run: 'key=$(python3 scripts/build-cache-key.py . ../UniXNU --os "${{ inputs.os
        }}")

        echo "key=$key" >> "$GITHUB_OUTPUT"

        echo "build cache key: $key"

        '
    - name: restore the build cache
      id: build-cache-restore
      uses: actions/cache/restore@v4
      with:
        path: 'device/deps

          UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree

          UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/xnu-inputs.json

          UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/package/Build/Out

          UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/edk2-conf

          uefi-sheng

          '
        key: build-${{ steps.build-cache.outputs.key }}
    - name: report the build cache
      run: 'echo "cache hit: ${{ steps.build-cache-restore.outputs.cache-hit }}"

        '
    - name: restore the sheng firmware inputs
      id: firmware-inputs
      uses: actions/cache/restore@v4
      with:
        path: 'device/.cache/firmware/sheng

          uefi-sheng/Binaries

          '
        key: sheng-fw-${{ hashFiles('device/board.toml') }}
    - name: report the firmware module layout
      working-directory: device
      run: "echo '--- sheng.dsc [Components] payload entries ---'\ngrep -E 'UniXNURamDiskDxe|DarwinBoot|DiskIoDxe|PartitionDxe|Fat\\\
        .inf|EnglishDxe' \\\n  ../uefi-sheng/Platforms/Xiaomi/shengPkg/sheng.dsc ||\
        \ echo '(none listed)'\necho '--- sheng.fdf Include/DXE.inc payload entries\
        \ ---'\ngrep -E 'UniXNURamDiskDxe|DarwinBoot|DiskIoDxe|PartitionDxe|Fat\\\
        .inf|EnglishDxe' \\\n  ../uefi-sheng/Platforms/Xiaomi/shengPkg/Include/DXE.inc\
        \ || echo '(none listed)'\necho '--- [uefi_fd] ---'\nsed -n '/\\[uefi_fd\\\
        ]/,/^\\[/p' ../uefi-sheng/Resources/Configs/sheng.toml\n"
    - name: select the configuration
      working-directory: device
      run: '../UniXNU/unixnu defconfig sheng_ipados27_defconfig -D . --os "${{ inputs.os
        }}"

        '
    - name: build the firmware volume
      id: firmware
      working-directory: device
      env:
        UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
      run: 'set -o pipefail

        args=(-D . --os "${{ inputs.os }}" --uefi ../uefi-sheng)

        ../UniXNU/unixnu build firmware "${args[@]}" 2>&1 | tail -60

        '
    - name: restore the payload from a previous run
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: "python3 - <<'PY'\nimport io, json, os, pathlib, urllib.error, urllib.request,\
        \ zipfile\n\nwork = pathlib.Path('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27')\n\
        target = work / 'payload/payload.img'\nif target.is_file():\n    print('payload\
        \ already present:', target.stat().st_size, 'bytes')\n    raise SystemExit(0)\n\
        \ntoken = os.environ['GITHUB_TOKEN']\napi = 'https://api.github.com/repos/chrndianjidakai-collab/UniXNU-sheng/actions/artifacts?per_page=100'\n\
        req = urllib.request.Request(api, headers={\n    'Authorization': 'Bearer\
        \ ' + token,\n    'Accept': 'application/vnd.github+json',\n    'User-Agent':\
        \ 'unixnu-firmware-probe'})\nwith urllib.request.urlopen(req, timeout=60)\
        \ as reply:\n    listing = json.loads(reply.read())\ncandidates = [a for a\
        \ in listing.get('artifacts', [])\n              if a['name'].startswith('images-')\
        \ and not a.get('expired')]\nif not candidates:\n    raise SystemExit('no\
        \ images artifact to take the payload from')\nnewest = max(candidates, key=lambda\
        \ a: a['created_at'])\nprint('payload source:', newest['name'], newest['created_at'])\n\
        \nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self,\
        \ req, fp, code, msg, headers, newurl):\n        return None\n\npayload =\
        \ None\ntry:\n    with urllib.request.build_opener(NoRedirect).open(\n   \
        \         urllib.request.Request(newest['archive_download_url'], headers={\n\
        \                'Authorization': 'Bearer ' + token,\n                'Accept':\
        \ 'application/vnd.github+json',\n                'User-Agent': 'unixnu-firmware-probe'}),\
        \ timeout=60) as reply:\n        payload = reply.read()\nexcept urllib.error.HTTPError\
        \ as error:\n    if error.code in (301, 302, 303, 307, 308) and error.headers.get('Location'):\n\
        \        with urllib.request.urlopen(error.headers['Location'], timeout=300)\
        \ as blob:\n            payload = blob.read()\n    else:\n        raise SystemExit(f'artifact\
        \ download failed: {error.code}')\narchive = zipfile.ZipFile(io.BytesIO(payload))\n\
        member = [n for n in archive.namelist() if n.endswith('payload.img')]\nif\
        \ not member:\n    raise SystemExit('the artifact carries no payload.img')\n\
        target.parent.mkdir(parents=True, exist_ok=True)\ntarget.write_bytes(archive.read(member[0]))\n\
        print('payload:', target.stat().st_size, 'bytes')\nPY\n"
    - name: report the firmware volume
      if: always()
      run: "python3 - <<'PY'\nimport glob, os, sys\npaths = glob.glob('uefi-sheng/Build/shengPkg/*/FV/*.fd')\n\
        if not paths:\n    print('no .fd produced')\n    sys.exit(0)\nfor path in\
        \ paths:\n    data = open(path, 'rb').read()\n    print(f'{os.path.basename(path)}:\
        \ {len(data)} bytes ({len(data)/1048576:.2f} MB)')\n    for word in ('SimpleFileSystem',\
        \ 'BlockIo', 'LoadImage', 'Fat',\n                 'DiskIo', 'Partition',\
        \ 'RamDisk', 'DarwinBoot', 'UniXNU'):\n        hit = data.find(word.encode())\n\
        \        print(f'  {word:18s} {\"present @\" + hex(hit) if hit >= 0 else \"\
        MISSING\"}')\nPY\n"
    - name: pack boot.img from the new firmware volume
      working-directory: device
      env:
        UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
      run: "set -o pipefail\n../UniXNU/unixnu bootimg \\\n  -D . \\\n  --os \"${{\
        \ inputs.os }}\" \\\n  --uefi ../uefi-sheng \\\n  --dtb ../UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/build/sheng/sheng.dtb\
        \ \\\n  --ramdisk ../UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/payload/payload.img\
        \ \\\n  -o ../UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/boot/boot-probe.img\
        \ 2>&1 | tail -30\nls -l ../UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/boot/\
        \ 2>/dev/null || true\n"
    - name: upload the firmware and the packed boot image
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: firmware-probe
        retention-days: 3
        if-no-files-found: warn
        path: 'uefi-sheng/Build/shengPkg/*/FV/*.fd

          UniXNU/out/sheng/*/*/boot/boot-probe.img

          UniXNU/out/sheng/*/*/boot/*.json

          UniXNU/out/sheng/*/*/logs/firmware.log

          UniXNU/out/sheng/*/*/logs/firmware-preflight.log

          '
