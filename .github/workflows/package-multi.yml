name: package-6lane
on:
  workflow_dispatch:
    inputs:
      os:
        description: OS profile of the images
        type: choice
        options:
        - '27'
        - '26'
        - '17'
        default: '27'
      init_data:
        description: Create a NEW installation seed if no saved seed exists (iPadOS
          27 only)
        type: boolean
        default: false
      data_seed_url:
        description: Optional original data.dbr URL for an existing installation;
          otherwise use the saved cache
        type: string
      data_seed_sha256:
        description: Required SHA-256 when data_seed_url is supplied
        type: string
permissions:
  contents: read
jobs:
  build:
    name: lane-${{ matrix.lane }}
    runs-on: macos-26
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        lane:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
    steps:
    - name: note the lane
      run: 'echo "lane ${{ matrix.lane }} acquired a runner at $(date -u +%FT%TZ)"

        echo "lane=${{ matrix.lane }}" >> "$GITHUB_STEP_SUMMARY"

        '
    - uses: actions/checkout@v4
      with:
        repository: UniXNU/UniXNU-sheng
        path: device
        submodules: recursive
    - uses: actions/checkout@v4
      with:
        repository: UniXNU/UniXNU
        ref: 82b847c4ac3f68a57024b3082ffa3a03442defd9
        path: UniXNU
        submodules: recursive
    - uses: actions/checkout@v4
      with:
        repository: UniXNU/uefi-sheng
        path: uefi-sheng
        submodules: recursive
    - name: target this unit's partition layout
      # Upstream board.toml carries the 256G-class SKU LBA range (3094592..64007162).
      # This unit is the 1 TB SKU: the dual-system split created unixnu at
      # 184345344..257745663 (280 GiB), which UniXNU owns, and moved userdata to
      # 3094784..184345343. The build refuses a layout that does not match the
      # GPT, so those two numbers are rewritten here rather than shipping a
      # forked board.toml.
      working-directory: device
      run: |
        python3 - <<'PY'
        import pathlib, re
        first, last = 184345344, 257745663
        path = pathlib.Path('board.toml')
        text = path.read_text(encoding='utf-8')
        if not re.search(r'^"first_lba" = %d$' % first, text, re.M):
            text, n1 = re.subn(r'^"first_lba" = \d+$', '"first_lba" = %d' % first, text, count=1, flags=re.M)
            text, n2 = re.subn(r'^"last_lba" = \d+$', '"last_lba" = %d' % last, text, count=1, flags=re.M)
            if n1 != 1 or n2 != 1:
                raise SystemExit('could not rewrite the userdata LBAs')
            path.write_text(text, encoding='utf-8')
        print('userdata %d..%d (1 TB SKU, unixnu 280 GiB)' % (first, last))
        PY
    - name: tools
      run: "brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools\
        \ bison pkgconf rustup blacktop/tap/ipsw\n{\n  echo \"$HOME/.cargo/bin\"\n\
        \  echo \"/opt/homebrew/opt/llvm/bin\"\n  echo \"/opt/homebrew/opt/lld/bin\"\
        \n  echo \"/opt/homebrew/opt/bison/bin\"\n} >> \"$GITHUB_PATH\"\nrustup toolchain\
        \ install 1.98.0 --profile minimal --component rust-src\nok=1\nfor t in clang\
        \ xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \\\
        \n         mformat mcopy ipsw; do\n  command -v \"$t\" >/dev/null || { echo\
        \ \"missing tool: $t\"; ok=0; }\ndone\nfor t in lld-link llvm-lib llvm-rc\
        \ llvm-nm llvm-objcopy; do\n  [ -f \"/opt/homebrew/opt/llvm/bin/$t\" ] ||\
        \ [ -f \"/opt/homebrew/opt/lld/bin/$t\" ] || { echo \"missing tool: $t\";\
        \ ok=0; }\ndone\n[ \"$ok\" = 1 ]\n"
    - name: platform seed
      env:
        seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
      run: "if ! [[ \"$seed\" =~ ^[0-9a-fA-F]{8}$ ]]; then\n  echo 'Set the repository\
        \ secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.'\
        \ >&2\n  exit 1\nfi\n"
    - name: seed cache identity
      id: seed-key
      env:
        SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
      run: "python3 - <<'PY'\nimport hashlib, os\nwith open(os.environ['GITHUB_OUTPUT'],\
        \ 'a') as out:\n    out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16]\
        \ + '\\n')\nPY\n"
    - uses: actions/cache/restore@v4
      id: data-cache
      if: inputs.os == '27'
      with:
        path: 'UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr

          UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json

          '
        key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
    - name: prepare preserved Data seed
      if: inputs.os == '27'
      env:
        INIT_DATA: ${{ inputs.init_data }}
        GITHUB_TOKEN: ${{ github.token }}
      run: "python3 - <<'PY'\nimport hashlib, io, json, os, pathlib, shutil, urllib.error,\
        \ urllib.request, zipfile\nprofile = 'ipados-27.0.1-24A446'\nwork = pathlib.Path('UniXNU/out/sheng')\
        \ / profile / 'sheng_ipados27' / 'runtime'\nseed = work / 'data.dbr'\nstamp\
        \ = work / 'inputs.json'\ninputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text()).get('inputs')\
        \ or {}\n\nif not seed.is_file():\n    committed = pathlib.Path('seed') /\
        \ profile\n    if (committed / 'data.dbr').is_file():\n        work.mkdir(parents=True,\
        \ exist_ok=True)\n        shutil.copyfile(committed / 'data.dbr', seed)\n\
        \        if (committed / 'inputs.json').is_file() and not stamp.is_file():\n\
        \            shutil.copyfile(committed / 'inputs.json', stamp)\n        print('seed:\
        \ copied from seed/' + profile)\n\nif not seed.is_file():\n    token = os.environ.get('GITHUB_TOKEN',\
        \ '')\n    try:\n        req = urllib.request.Request(\n            'https://api.github.com/repos/chrndianjidakai-collab/UniXNU-sheng/actions/artifacts?per_page=100',\n\
        \            headers={'Authorization': 'Bearer ' + token,\n              \
        \       'Accept': 'application/vnd.github+json',\n                     'User-Agent':\
        \ 'unixnu-seed-restore'})\n        with urllib.request.urlopen(req, timeout=60)\
        \ as reply:\n            listing = json.loads(reply.read())\n        candidates\
        \ = [a for a in listing.get('artifacts', [])\n                      if a['name'].startswith('installation-seed-27')\
        \ and not a.get('expired')]\n    except (urllib.error.URLError, ValueError)\
        \ as error:\n        candidates = []\n        print('seed: artifact listing\
        \ failed:', error)\n    if candidates:\n        newest = max(candidates, key=lambda\
        \ a: a['created_at'])\n\n        # The archive endpoint answers 302 to a pre-signed\
        \ blob URL that\n        # rejects a bearer token; urllib would carry the\
        \ header across the\n        # redirect and the download dies with HTTP 401.\
        \ Follow it by hand.\n        class NoRedirect(urllib.request.HTTPRedirectHandler):\n\
        \            def redirect_request(self, req, fp, code, msg, headers, newurl):\n\
        \                return None\n\n        payload = None\n        try:\n   \
        \         with urllib.request.build_opener(NoRedirect).open(\n           \
        \         urllib.request.Request(newest['archive_download_url'], headers={\n\
        \                        'Authorization': 'Bearer ' + token,\n           \
        \             'Accept': 'application/vnd.github+json',\n                 \
        \       'User-Agent': 'unixnu-seed-restore'}), timeout=60) as reply:\n   \
        \             payload = reply.read()\n        except urllib.error.HTTPError\
        \ as error:\n            if error.code in (301, 302, 303, 307, 308) and error.headers.get('Location'):\n\
        \                with urllib.request.urlopen(error.headers['Location'], timeout=300)\
        \ as blob:\n                    payload = blob.read()\n            else:\n\
        \                print('seed: artifact download failed:', error.code)\n  \
        \      if payload:\n            archive = zipfile.ZipFile(io.BytesIO(payload))\n\
        \            names = archive.namelist()\n            members = [n for n in\
        \ names if n.endswith('data.dbr')]\n            stamps = [n for n in names\
        \ if n.endswith('inputs.json')]\n            if members:\n               \
        \ work.mkdir(parents=True, exist_ok=True)\n                seed.write_bytes(archive.read(members[0]))\n\
        \                if stamps and not stamp.is_file():\n                    stamp.write_bytes(archive.read(stamps[0]))\n\
        \                print('seed: restored from artifact', newest['name'])\n\n\
        url = inputs.get('data_seed_url', '')\ndigest = inputs.get('data_seed_sha256',\
        \ '').lower()\nif url and not seed.is_file():\n    print('::add-mask::' +\
        \ url)\n    if not url.startswith('https://') or len(digest) != 64 or any(c\
        \ not in '0123456789abcdef' for c in digest):\n        raise SystemExit('A\
        \ seed URL requires HTTPS and its SHA-256')\n    with urllib.request.urlopen(url,\
        \ timeout=120) as source:\n        data = source.read(64 * 1024 * 1024 + 1)\n\
        \    if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() !=\
        \ digest:\n        raise SystemExit('Seed size or SHA-256 mismatch')\n   \
        \ work.mkdir(parents=True, exist_ok=True)\n    seed.write_bytes(data)\n  \
        \  print('seed: downloaded from the dispatch input')\n\nif seed.is_file():\n\
        \    print('seed ready:', seed.stat().st_size, 'bytes',\n          hashlib.sha256(seed.read_bytes()).hexdigest()[:16])\n\
        elif os.environ.get('INIT_DATA') != 'true':\n    raise SystemExit('No saved\
        \ seed. Supply the ORIGINAL seed for an existing installation, '\n       \
        \              'or select init_data for a FIRST installation')\nPY\n"
    - name: repair the pinned Mesa series
      working-directory: device
      run: 'python3 scripts/repair-mesa-series.py ../UniXNU

        '
    - name: fetch the Wi-Fi supplicant sources
      working-directory: device/drivers/Ath12kWifi
      timeout-minutes: 45
      run: 'set -x

        python3 --version

        ls -l tools/fetch-sources.py tools/source-lock.json

        # Two independent defects make a fresh fetch impossible:

        #

        #  1. every sparse path in tools/source-lock.json carries a leading

        #     slash ("/include/"), and git answers

        #       fatal: specify directories rather than patterns (no leading slash)

        #  2. a few entries name single files, and `sparse-checkout add` accepts

        #     directories only:

        #       fatal: ''net/core/skbuff.c'' is not a directory

        #

        # The first helper strips the slashes and moves file entries into a new

        # `files` list; the second teaches fetch-sources.py to stage those with

        # `git checkout <commit> -- <file>`. Commit pins and the supplicant

        # sha256 are untouched.

        python3 ../../scripts/fix-ath12k-sparse-paths.py .

        python3 ../../scripts/patch-fetch-sources.py .

        python3 tools/fetch-sources.py

        echo ''--- verify the check that failed before now passes ---''

        python3 tools/fetch-sources.py --check

        du -sh deps/* 2>/dev/null || true

        '
    - name: advance the sm8550 kit pin
      working-directory: device
      run: "# The pin is recorded in three places; the helper rewrites whichever\n\
        # of them this checkout actually carries:\n#   UniXNU/components.toml  [[component]]\
        \ id = \"Sm8550Platform\"  revision\n#   UniXNU/unixnu.lock      [source.\"\
        sm8550\"]                    commit\n#   device/feeds.toml       [[source]]\
        \ name = \"sm8550\"           commit\n#\n# unixnu.lock does not exist in a\
        \ fresh UniXNU checkout (it is written\n# by \"unixnu fetch\"), so every check\
        \ below must tolerate absence: an\n# earlier revision of this step ended with\
        \ a bare `grep` on a missing\n# file and killed the whole job with exit 2\
        \ before the build started.\npython3 scripts/advance-sm8550-kit.py ../UniXNU\
        \ .\n\necho '--- components.toml ---'\ngrep -A8 'id = \"Sm8550Platform\"'\
        \ ../UniXNU/components.toml | grep -E 'revision|path' || true\n\necho '---\
        \ feeds.toml ---'\ngrep -A3 'name = \"sm8550\"' feeds.toml || true\n\necho\
        \ '--- both must now carry the same pin ---'\n# Do not hard-code the revision\
        \ here: advance-sm8550-kit.py owns it, and\n# a literal in this workflow already\
        \ drifted out of sync once (the check\n# looked for 009512d6 after the helper\
        \ had moved to f04fd8b1 and failed\n# the job even though the helper had done\
        \ its work). Compare the two\n# files against each other instead.\npython3\
        \ - <<'PY'\nimport re, sys, pathlib\ncomp = pathlib.Path('../UniXNU/components.toml').read_text(encoding='utf-8')\n\
        feeds = pathlib.Path('feeds.toml').read_text(encoding='utf-8')\nm = re.search(r'id\
        \ = \"Sm8550Platform\".*?revision = \"([0-9a-f]{40})\"', comp, re.S)\nf =\
        \ re.search(r'name = \"sm8550\".*?commit = \"([0-9a-f]{40})\"', feeds, re.S)\n\
        if not m or not f:\n    sys.exit('could not read the Sm8550Platform revision\
        \ or the feeds commit')\nif m.group(1) != f.group(1):\n    sys.exit(f'pin\
        \ mismatch: components.toml {m.group(1)[:8]} vs feeds.toml {f.group(1)[:8]}')\n\
        if m.group(1) == 'a9f45dc60c035084b95463781538380f4c3606c9':\n    sys.exit('the\
        \ helper did not advance the pin; the kit would miss Sm8550GeniUart.h')\n\
        print(f'OK   both files pin sm8550 to {m.group(1)[:8]}')\nPY\n"
    - name: stage the proprietary firmware blobs
      working-directory: device
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: 'python3 scripts/stage-proprietary.py .

        echo ''--- confirm all three digests ---''

        python3 scripts/stage-proprietary.py . --check

        ls -l .cache/firmware/nanosic .cache/firmware/novatek .cache/firmware/qcom/sm8550/sheng

        '
    - name: patch the fileset reference build
      working-directory: device
      run: '# Run the patch twice: the second run must report "already", which is

        # the patch script''s own idempotency check — no hand-written string

        # matching that drifts when the script''s wording changes.

        python3 scripts/patch-fileset-reference.py ../UniXNU

        python3 scripts/patch-fileset-reference.py ../UniXNU

        '
    - name: confirm the XnuPrelink revision
      run: "cd UniXNU/kits/XnuPrelink\nhead=$(git rev-parse HEAD)\necho \"XnuPrelink\
        \ at $head\"\nif [ \"$head\" != \"440589b0c31625f17edf363e24b3c82c51c70bb9\"\
        \ ]; then\n  echo \"pinned revision differs from the one this board qualifies;\
        \ fetching it\"\n  git fetch --depth 1 origin 440589b0c31625f17edf363e24b3c82c51c70bb9\n\
        \  git checkout --detach FETCH_HEAD\n  git rev-parse HEAD\nfi\n"
    - name: raise the metal bridge cargo timeout
      working-directory: device
      run: 'python3 scripts/patch-metal-bridge-timeout.py ../UniXNU

        python3 scripts/patch-metal-bridge-timeout.py ../UniXNU

        '
    - name: report the prelink layout overrun
      working-directory: device
      run: 'python3 scripts/patch-prelink-layout.py ../UniXNU

        python3 scripts/patch-prelink-layout.py ../UniXNU

        '
    - name: patch the prelink dependency closure
      working-directory: device
      run: 'python3 scripts/patch-prelink-closure.py ../UniXNU

        python3 scripts/patch-prelink-closure.py ../UniXNU

        '
    - name: patch the weak defaults
      working-directory: device
      run: '# Run the patch twice: the second run must report "already patched",

        # which is the patch script''s own idempotency check — no hand-written

        # string matching that drifts when the script''s wording changes.

        python3 scripts/patch-weak-defaults.py ../UniXNU

        python3 scripts/patch-weak-defaults.py ../UniXNU

        '
    - name: build cache identity
      id: build-cache
      working-directory: device
      run: 'key=$(python3 scripts/build-cache-key.py . ../UniXNU --os "${{ inputs.os
        }}")

        echo "key=$key" >> "$GITHUB_OUTPUT"

        echo "build cache key: $key"

        '
    - name: restore the build cache
      id: build-cache-restore
      uses: actions/cache/restore@v4
      with:
        path: 'device/deps

          UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree

          UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/xnu-inputs.json

          UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/package/Build/Out

          UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/edk2-conf

          uefi-sheng

          '
        key: build-${{ steps.build-cache.outputs.key }}
    - name: report the build cache
      run: 'echo "cache hit: ${{ steps.build-cache-restore.outputs.cache-hit }}"

        du -sh device/deps UniXNU/out uefi-sheng 2>/dev/null || true

        '
    - name: restore the sheng firmware inputs
      id: firmware-inputs
      uses: actions/cache/restore@v4
      with:
        path: 'device/.cache/firmware/sheng

          uefi-sheng/Binaries

          '
        key: sheng-fw-${{ hashFiles('device/board.toml') }}
    - name: package
      id: package
      working-directory: device
      env:
        UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        GITHUB_TOKEN: ${{ github.token }}
        INIT_DATA: ${{ inputs.init_data }}
        OS_PROFILE: ${{ inputs.os }}
      run: "args=(--os \"$OS_PROFILE\" --uefi ../uefi-sheng)\nif [ \"$OS_PROFILE\"\
        \ = 27 ] && [ \"$INIT_DATA\" = true ]; then\n  args+=(--init-data)\nfi\nscripts/package.sh\
        \ \"${args[@]}\"\n"
    - name: save the sheng firmware inputs
      if: always() && steps.firmware-inputs.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: 'device/.cache/firmware/sheng

          uefi-sheng/Binaries

          '
        key: sheng-fw-${{ hashFiles('device/board.toml') }}
    - name: verify the firmware volume is complete
      working-directory: UniXNU
      run: "python3 - <<'PY'\nimport glob, lzma, struct, sys, zlib\n\nimages = glob.glob('out/sheng/*/*/boot/boot.img')\n\
        if not images:\n    sys.exit('no boot.img was produced')\nboot = open(images[0],\
        \ 'rb').read()\nif boot[:8] != b'ANDROID!':\n    sys.exit('boot.img does not\
        \ start with ANDROID!')\nkernel_size = struct.unpack_from('<I', boot, 8)[0]\n\
        page = struct.unpack_from('<I', boot, 36)[0] or 4096\nblob = boot[page:page\
        \ + kernel_size]\n\n# Layer 1: the gzip stream around BootShim + the firmware\
        \ volume.\nd = zlib.decompressobj(16 + zlib.MAX_WBITS)\nouter = d.decompress(blob)\
        \ + d.flush()\nif not d.eof:\n    sys.exit('the kernel field is not a complete\
        \ gzip stream')\nprint(f'outer firmware volume: {len(outer)} bytes ({len(outer)/1048576:.2f}\
        \ MB)')\n\n# Layer 2: FVMAIN_COMPACT is LZMA in an FV_IMAGE file. Find the\
        \ stream\n# by its properties byte; the 8-byte size that follows is the\n\
        # uncompressed length.\ninner = None\nfor at in range(len(outer) - 8):\n \
        \   if outer[at] != 0x5D or outer[at + 1] or outer[at + 2]:\n        continue\n\
        \    try:\n        dec = lzma.LZMADecompressor(format=lzma.FORMAT_ALONE)\n\
        \        got = dec.decompress(outer[at:at + 4 * 1024 * 1024])\n    except\
        \ Exception:\n        continue\n    if len(got) > 1024 * 1024:\n        inner\
        \ = got\n        print(f'inner FVMAIN: {len(got)} bytes ({len(got)/1048576:.2f}\
        \ MB) '\n              f'at offset {at}')\n        break\nif inner is None:\n\
        \    sys.exit('the firmware volume carries no decompressible FVMAIN')\n\n\
        # What the payload path needs; the guide lists exactly these.\nneeded = ('UniXNURamDiskDxe',\
        \ 'DarwinBoot', 'DiskIo', 'EnhancedFat',\n          'SimpleFileSystem', 'BlockIo')\n\
        missing = [w for w in needed if w.encode() not in inner]\nfor word in needed:\n\
        \    print(f'  {word:18s} {\"present\" if word.encode() in inner else \"MISSING\"\
        }')\nif missing:\n    sys.exit('firmware is missing ' + ', '.join(missing))\n\
        print('firmware carries the whole payload path')\nPY\n"
    - name: build userdata-root.img
      working-directory: UniXNU
      env:
        UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        UNIXNU_UEFI: ${{ github.workspace }}/uefi-sheng
      run: './unixnu build userdata --dry-run

        ./unixnu build userdata

        '
    - name: report
      if: always()
      working-directory: UniXNU
      run: "echo \"## lane ${{ matrix.lane }}\" >> \"$GITHUB_STEP_SUMMARY\"\nfor f\
        \ in out/sheng/*/*/userdata/userdata-root.json; do\n  [ -f \"$f\" ] || continue\n\
        \  echo '```json' >> \"$GITHUB_STEP_SUMMARY\"\n  head -c 8000 \"$f\" >> \"\
        $GITHUB_STEP_SUMMARY\"\n  echo '```' >> \"$GITHUB_STEP_SUMMARY\"\ndone\nls\
        \ -l out/sheng/*/*/userdata/ out/sheng/*/*/boot/ 2>/dev/null || true\n"
    - uses: actions/cache/save@v4
      if: always() && inputs.os == '27' && steps.data-cache.outputs.cache-hit != 'true'
        && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr')
        != ''
      with:
        path: 'UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr

          UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json

          '
        key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
    - name: save the build cache
      if: always() && steps.build-cache.outputs.key != '' && steps.build-cache-restore.outputs.cache-hit
        != 'true'
      uses: actions/cache/save@v4
      with:
        path: 'device/deps

          UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree

          UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/xnu-inputs.json

          UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/package/Build/Out

          UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/edk2-conf

          uefi-sheng

          '
        key: build-${{ steps.build-cache.outputs.key }}
    - name: installation seed backup
      if: always() && inputs.os == '27' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr')
        != ''
      uses: actions/upload-artifact@v4
      with:
        name: installation-seed-${{ inputs.os }}-lane${{ matrix.lane }}
        retention-days: 30
        path: 'UniXNU/out/sheng/*/*/runtime/data.dbr

          UniXNU/out/sheng/*/*/runtime/inputs.json

          '
    - name: images
      uses: actions/upload-artifact@v4
      with:
        name: images-${{ inputs.os }}-lane${{ matrix.lane }}
        retention-days: 30
        if-no-files-found: error
