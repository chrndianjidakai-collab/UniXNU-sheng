name: package-6lane

# scripts/package.sh of this repository on a macOS runner, with the UniXNU and uefi-sheng
# checkouts beside it, the layout board.toml names. The platform seed comes from the
# repository secret UNIXNU_UNIQUE_CHIP_ID and is baked into the images, so the run's
# artifacts belong to one device alone: download them, then delete the run.
#
# SIX job lanes on purpose. GitHub-hosted macOS arm64 capacity is scarce, and a job
# that loses the race sits in "Waiting for a runner" for the full 15-minute
# acquisition cap before GitHub gives up with "The job was not acquired by Runner of
# type hosted". A single lane therefore loses the whole night when it is unlucky.
# Each lane is an independent queue ticket for identical work, so the build starts
# as soon as any one lane is picked up; the losers are cancelled by the driver. All
# lanes publish distinct artifact names so they never collide.
on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27", "26", "17"]
        default: "27"
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 only)"
        type: boolean
        default: false
      data_seed_url:
        description: "Optional original data.dbr URL for an existing installation; otherwise use the saved cache"
        type: string
      data_seed_sha256:
        description: "Required SHA-256 when data_seed_url is supplied"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: lane-${{ matrix.lane }}
    runs-on: macos-26
    timeout-minutes: 360
    strategy:
      # Every lane competes independently; one failing must not cancel the others.
      fail-fast: false
      max-parallel: 6
      matrix:
        lane: [0, 1, 2, 3, 4, 5]
    steps:
      - name: note the lane
        run: |
          echo "lane ${{ matrix.lane }} acquired a runner at $(date -u +%FT%TZ)"
          echo "lane=${{ matrix.lane }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 82b847c4ac3f68a57024b3082ffa3a03442defd9 # Wi-Fi runtime and Data firmware integration
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-sheng
          submodules: recursive
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: data-cache
        if: inputs.os == '27'
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: prepare preserved Data seed
        # Three sources, in order, so a missing cache never stops the build:
        #   1. seed/<profile>/data.dbr committed in this repository (stable)
        #   2. the newest installation-seed artifact, one-day retention
        #   3. the data_seed_url dispatch input when one is supplied
        # A FIRST installation may instead select init_data.
        if: inputs.os == '27'
        env:
          INIT_DATA: ${{ inputs.init_data }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, shutil, urllib.error, urllib.request, zipfile
          profile = 'ipados-27.0.1-24A446'
          work = pathlib.Path('UniXNU/out/sheng') / profile / 'sheng_ipados27' / 'runtime'
          seed = work / 'data.dbr'
          stamp = work / 'inputs.json'
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text()).get('inputs') or {}

          if not seed.is_file():
              committed = pathlib.Path('seed') / profile
              if (committed / 'data.dbr').is_file():
                  work.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(committed / 'data.dbr', seed)
                  if (committed / 'inputs.json').is_file() and not stamp.is_file():
                      shutil.copyfile(committed / 'inputs.json', stamp)
                  print('seed: copied from seed/' + profile)

          if not seed.is_file():
              token = os.environ.get('GITHUB_TOKEN', '')
              try:
                  req = urllib.request.Request(
                      'https://api.github.com/repos/chrndianjidakai-collab/UniXNU-sheng/actions/artifacts?per_page=100',
                      headers={'Authorization': 'Bearer ' + token,
                               'Accept': 'application/vnd.github+json',
                               'User-Agent': 'unixnu-seed-restore'})
                  with urllib.request.urlopen(req, timeout=60) as reply:
                      listing = json.loads(reply.read())
                  candidates = [a for a in listing.get('artifacts', [])
                                if a['name'].startswith('installation-seed-27') and not a.get('expired')]
              except (urllib.error.URLError, ValueError) as error:
                  candidates = []
                  print('seed: artifact listing failed:', error)
              if candidates:
                  newest = max(candidates, key=lambda a: a['created_at'])

                  # The archive endpoint answers 302 to a pre-signed blob URL that
                  # rejects a bearer token; urllib would carry the header across the
                  # redirect and the download dies with HTTP 401. Follow it by hand.
                  class NoRedirect(urllib.request.HTTPRedirectHandler):
                      def redirect_request(self, req, fp, code, msg, headers, newurl):
                          return None

                  payload = None
                  try:
                      with urllib.request.build_opener(NoRedirect).open(
                              urllib.request.Request(newest['archive_download_url'], headers={
                                  'Authorization': 'Bearer ' + token,
                                  'Accept': 'application/vnd.github+json',
                                  'User-Agent': 'unixnu-seed-restore'}), timeout=60) as reply:
                          payload = reply.read()
                  except urllib.error.HTTPError as error:
                      if error.code in (301, 302, 303, 307, 308) and error.headers.get('Location'):
                          with urllib.request.urlopen(error.headers['Location'], timeout=300) as blob:
                              payload = blob.read()
                      else:
                          print('seed: artifact download failed:', error.code)
                  if payload:
                      archive = zipfile.ZipFile(io.BytesIO(payload))
                      names = archive.namelist()
                      members = [n for n in names if n.endswith('data.dbr')]
                      stamps = [n for n in names if n.endswith('inputs.json')]
                      if members:
                          work.mkdir(parents=True, exist_ok=True)
                          seed.write_bytes(archive.read(members[0]))
                          if stamps and not stamp.is_file():
                              stamp.write_bytes(archive.read(stamps[0]))
                          print('seed: restored from artifact', newest['name'])

          url = inputs.get('data_seed_url', '')
          digest = inputs.get('data_seed_sha256', '').lower()
          if url and not seed.is_file():
              print('::add-mask::' + url)
              if not url.startswith('https://') or len(digest) != 64 or any(c not in '0123456789abcdef' for c in digest):
                  raise SystemExit('A seed URL requires HTTPS and its SHA-256')
              with urllib.request.urlopen(url, timeout=120) as source:
                  data = source.read(64 * 1024 * 1024 + 1)
              if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Seed size or SHA-256 mismatch')
              work.mkdir(parents=True, exist_ok=True)
              seed.write_bytes(data)
              print('seed: downloaded from the dispatch input')

          if seed.is_file():
              print('seed ready:', seed.stat().st_size, 'bytes',
                    hashlib.sha256(seed.read_bytes()).hexdigest()[:16])
          elif os.environ.get('INIT_DATA') != 'true':
              raise SystemExit('No saved seed. Supply the ORIGINAL seed for an existing installation, '
                               'or select init_data for a FIRST installation')
          PY

      - name: repair the pinned Mesa series
        # turnip-frame-diagnostics.patch creates a header without the
        # "new file mode"/"index" lines git needs, so git apply aborts with
        # "error: dev/null: No such file or directory". Repair the header only;
        # the hunk body is untouched, so the tree still reconstructs the pin.
        working-directory: device
        run: |
          python3 scripts/repair-mesa-series.py ../UniXNU
      - name: fetch the Wi-Fi supplicant sources
        # drivers/Ath12kWifi/tools/prepare-supplicant.py starts with
        #   fetch-sources.py --check
        # and --check only verifies that deps/ already holds the locked trees; it
        # downloads nothing. A fresh checkout has an empty deps/, so the payload
        # step died at drivers/Ath12kWifi/tools/prepare-supplicant.py with exit 1
        # after 26 minutes of kernel work. Fetch them once, up front.
        #
        # The locked sources are linux v7.0.14 (sparse), the wpa_supplicant 2.12
        # release tarball and freebsd releng/15.1 (sparse).
        working-directory: device/drivers/Ath12kWifi
        timeout-minutes: 45
        run: |
          set -x
          python3 --version
          ls -l tools/fetch-sources.py tools/source-lock.json
          # Two independent defects make a fresh fetch impossible:
          #
          #  1. every sparse path in tools/source-lock.json carries a leading
          #     slash ("/include/"), and git answers
          #       fatal: specify directories rather than patterns (no leading slash)
          #  2. a few entries name single files, and `sparse-checkout add` accepts
          #     directories only:
          #       fatal: 'net/core/skbuff.c' is not a directory
          #
          # The first helper strips the slashes and moves file entries into a new
          # `files` list; the second teaches fetch-sources.py to stage those with
          # `git checkout <commit> -- <file>`. Commit pins and the supplicant
          # sha256 are untouched.
          python3 ../../scripts/fix-ath12k-sparse-paths.py .
          python3 ../../scripts/patch-fetch-sources.py .
          python3 tools/fetch-sources.py
          echo '--- verify the check that failed before now passes ---'
          python3 tools/fetch-sources.py --check
          du -sh deps/* 2>/dev/null || true
      - name: advance the sm8550 kit pin
        # package/BluetoothProbe.cpp includes "Sm8550GeniUart.h" and calls
        # sm8550_geni_uart14_vote()/sm8550_geni_uart14_source().
        # build-gop-legacy-display-27.py compiles it with
        #   -I <tree>/kits/Sm8550Platform
        # but components.toml pins Sm8550Platform to a9f45dc6, whose
        # kits/Sm8550Platform/ has only the GPU files (ShengGmu*, ShengGpuSmmu*).
        # The GENI UART sources land one commit later, 009512d6, as pure additions
        # (+218 lines, nothing removed). Without this the build dies with
        #   fatal error: 'Sm8550GeniUart.h' file not found
        working-directory: device
        run: |
          # The pin is recorded in three places; the helper rewrites whichever
          # of them this checkout actually carries:
          #   UniXNU/components.toml  [[component]] id = "Sm8550Platform"  revision
          #   UniXNU/unixnu.lock      [source."sm8550"]                    commit
          #   device/feeds.toml       [[source]] name = "sm8550"           commit
          #
          # unixnu.lock does not exist in a fresh UniXNU checkout (it is written
          # by "unixnu fetch"), so every check below must tolerate absence: an
          # earlier revision of this step ended with a bare `grep` on a missing
          # file and killed the whole job with exit 2 before the build started.
          python3 scripts/advance-sm8550-kit.py ../UniXNU .

          echo '--- components.toml ---'
          grep -A8 'id = "Sm8550Platform"' ../UniXNU/components.toml | grep -E 'revision|path' || true

          echo '--- feeds.toml ---'
          grep -A3 'name = "sm8550"' feeds.toml || true

          echo '--- both must now carry the same pin ---'
          # Do not hard-code the revision here: advance-sm8550-kit.py owns it, and
          # a literal in this workflow already drifted out of sync once (the check
          # looked for 009512d6 after the helper had moved to f04fd8b1 and failed
          # the job even though the helper had done its work). Compare the two
          # files against each other instead.
          python3 - <<'PY'
          import re, sys, pathlib
          comp = pathlib.Path('../UniXNU/components.toml').read_text(encoding='utf-8')
          feeds = pathlib.Path('feeds.toml').read_text(encoding='utf-8')
          m = re.search(r'id = "Sm8550Platform".*?revision = "([0-9a-f]{40})"', comp, re.S)
          f = re.search(r'name = "sm8550".*?commit = "([0-9a-f]{40})"', feeds, re.S)
          if not m or not f:
              sys.exit('could not read the Sm8550Platform revision or the feeds commit')
          if m.group(1) != f.group(1):
              sys.exit(f'pin mismatch: components.toml {m.group(1)[:8]} vs feeds.toml {f.group(1)[:8]}')
          if m.group(1) == 'a9f45dc60c035084b95463781538380f4c3606c9':
              sys.exit('the helper did not advance the pin; the kit would miss Sm8550GeniUart.h')
          print(f'OK   both files pin sm8550 to {m.group(1)[:8]}')
          PY
      - name: stage the proprietary firmware blobs
        # proprietary-files.txt lists three paths with SHA-256 digests:
        #   novatek/novatek_nt36532_n81a_fw_csot.bin   Touch
        #   nanosic/MCU_Upgrade.bin                    Keyboard
        #   qcom/sm8550/sheng/vpu30_4v.mbn             Video
        # build-gop-legacy-display-27.py reads them from <device>/.cache/firmware
        # near the end of its 35-minute run and aborts with
        #   nanosic/MCU_Upgrade.bin: run scripts/extract-files.py --section Keyboard
        # Stage them up front, verifying each digest.
        working-directory: device
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/stage-proprietary.py .
          echo '--- confirm all three digests ---'
          python3 scripts/stage-proprietary.py . --check
          ls -l .cache/firmware/nanosic .cache/firmware/novatek .cache/firmware/qcom/sm8550/sheng
      - name: patch the fileset reference build
        # build-fileset-release-reference.py hard-codes the archives it links
        # (libpthread_kernel, libArmDTPlatform, libArmCpu) and never reads the
        # defconfig. On 27 the kernel path needs libShengSourceStorage.a, which
        # defines _sheng_boot_watchdog_policy and
        # _native_verified_block_volume_device; without it the arm64e link fails.
        working-directory: device
        run: |
          # Run the patch twice: the second run must report "already", which is
          # the patch script's own idempotency check — no hand-written string
          # matching that drifts when the script's wording changes.
          python3 scripts/patch-fileset-reference.py ../UniXNU
          python3 scripts/patch-fileset-reference.py ../UniXNU
      - name: patch the prelink dependency closure
        # The pinned XnuPrelink submodule's dependency_closure() only strips the
        # `!` exclusion prefix from --root arguments, not from dependencies
        # reached through a kext's OSBundleLibraries. iPadOS 27's kernelcache
        # contains such a `!com.apple.driver.AppleSMC` entry, so prelink dies
        # with "Missing prelink dependency". Run twice for idempotency.
        working-directory: device
        run: |
          python3 scripts/patch-prelink-closure.py ../UniXNU
          python3 scripts/patch-prelink-closure.py ../UniXNU
      - name: patch the weak defaults
        # build-sheng-source-storage.py's weak_defaults() only covers BootLog.c
        # and only single-line declarations. BootLog.c's native_data_io_* block is
        # one declaration folded across six lines, and LegacyDisplayProbe.cpp /
        # BluetoothProbe.cpp declare their own weak_import symbols; nothing provides
        # them on iPadOS 27, so the arm64e kernel link dies on undefined symbols.
        working-directory: device
        run: |
          # Run the patch twice: the second run must report "already patched",
          # which is the patch script's own idempotency check — no hand-written
          # string matching that drifts when the script's wording changes.
          python3 scripts/patch-weak-defaults.py ../UniXNU
          python3 scripts/patch-weak-defaults.py ../UniXNU
      - name: build cache identity
        # Hosted macOS runners start empty, so `deps` (uefi-sheng submodules,
        # linux/freebsd sources) and the kernel compile repeat from zero every
        # run — roughly 4 + 35 minutes. The key folds in everything that changes
        # the objects: board.toml, the source pins, the component pins, the patch
        # series, the driver scripts, both repository revisions and the profile.
        # A changed patch therefore misses the cache instead of restoring stale
        # objects, which is the failure mode that matters here.
        id: build-cache
        working-directory: device
        run: |
          key=$(python3 scripts/build-cache-key.py . ../UniXNU --os "${{ inputs.os }}")
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "build cache key: $key"
      - name: restore the build cache
        id: build-cache-restore
        uses: actions/cache/restore@v4
        with:
          # Scoped: the raw `UniXNU/out` also holds the decrypted IPSW images
          # (~15 GB under runtime/), which pushed this cache to 18 GB, over the
          # 10 GB repository limit — GitHub then evicted the data-seed cache and
          # lanes died with "No saved seed". The build tree (patched XNU sources
          # + objects) is the expensive part worth keeping; runtime/ is derived
          # and re-extracted each run.
          path: |
            device/deps
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/xnu-inputs.json
            uefi-sheng
          key: build-${{ steps.build-cache.outputs.key }}
      - name: report the build cache
        run: |
          echo "cache hit: ${{ steps.build-cache-restore.outputs.cache-hit }}"
          du -sh device/deps UniXNU/out uefi-sheng 2>/dev/null || true
      - name: package
        id: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          args=(--os "$OS_PROFILE" --uefi ../uefi-sheng)
          if [ "$OS_PROFILE" = 27 ] && [ "$INIT_DATA" = true ]; then
            args+=(--init-data)
          fi
          scripts/package.sh "${args[@]}"
      - name: build userdata-root.img
        # `scripts/package.sh` (unixnu release) never runs `unixnu build
        # userdata`, so the root file system image for the unixnu partition has
        # to be built here, on the runner that already has the toolchain.
        working-directory: UniXNU
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          UNIXNU_UEFI: ${{ github.workspace }}/uefi-sheng
        run: |
          ./unixnu build userdata --dry-run
          ./unixnu build userdata
      - name: report
        if: always()
        working-directory: UniXNU
        run: |
          echo "## lane ${{ matrix.lane }}" >> "$GITHUB_STEP_SUMMARY"
          for f in out/sheng/*/*/userdata/userdata-root.json; do
            [ -f "$f" ] || continue
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            head -c 8000 "$f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          ls -l out/sheng/*/*/userdata/ out/sheng/*/*/boot/ 2>/dev/null || true
      - uses: actions/cache/save@v4
        if: always() && inputs.os == '27' && steps.data-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: save the build cache
        # Save even when a later archive step fails. A failed run's objects are
        # still valid input for the next run: the XNU patch step skips itself when
        # its inputs signature matches (unixnu/patches.py), make only rebuilds
        # what is missing, and the qualified archives carry sha256 checks at link
        # time. Losing 40+ minutes of objects on every failed probe costs far
        # more than the rare half-written object, which a linker error exposes.
        # Always() also covers manual cancellations mid-compile.
        if: always() && steps.build-cache.outputs.key != '' && steps.build-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          # Scoped: the raw `UniXNU/out` also holds the decrypted IPSW images
          # (~15 GB under runtime/), which pushed this cache to 18 GB, over the
          # 10 GB repository limit — GitHub then evicted the data-seed cache and
          # lanes died with "No saved seed". The build tree (patched XNU sources
          # + objects) is the expensive part worth keeping; runtime/ is derived
          # and re-extracted each run.
          path: |
            device/deps
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/xnu-inputs.json
            uefi-sheng
          key: build-${{ steps.build-cache.outputs.key }}
      - name: installation seed backup
        if: always() && inputs.os == '27' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-${{ inputs.os }}-lane${{ matrix.lane }}
          retention-days: 1
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}-lane${{ matrix.lane }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json
      - name: userdata image
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ inputs.os }}-lane${{ matrix.lane }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            UniXNU/out/sheng/*/*/userdata/userdata-root.img
            UniXNU/out/sheng/*/*/userdata/userdata-root.json
